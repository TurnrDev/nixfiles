name: Nix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Run flake checks
        run: nix flake check --all-systems
      - name: Evaluate every NixOS host
        run: |
          nix eval .#nixosConfigurations.jay-framework.config.system.build.toplevel.drvPath --raw >/dev/null
          nix eval .#nixosConfigurations.jay-desktop.config.system.build.toplevel.drvPath --raw >/dev/null
          nix eval .#nixosConfigurations.jay-mopo.config.system.build.toplevel.drvPath --raw >/dev/null
      - name: Test repository shell scripts
        run: nix shell nixpkgs#bats -c bats tests/nixos-build-and-activate.bats
      - name: Run Python tests when present
        run: |
          mapfile -t test_files < <(git ls-files "test_*.py" "*_test.py" "tests/**/*.py")
          if (( ${#test_files[@]} )); then
            nix shell nixpkgs#python3Packages.pytest -c pytest "${test_files[@]}"
          fi

  dockmgr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Run dockmgr flake checks
        run: nix flake check ./packages/dockmgr
