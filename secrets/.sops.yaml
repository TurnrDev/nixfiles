keys:
  - &recovery age1mgs247pc6drcn3l8jy36ayy3km3qf9jjlej2td6f3nsfztjlys6sqpz23l
  - &jay_framework age10zny3zkm6y4ea8xjjp4y0mxa8vxte92ad3fhlfv8femjdel45sqq0txt4t
  - &jay_desktop age17gwuzf0f72fr0r24wfkhxxy9mretfqkfx8dqnf9xg83tr403cqlsdg0a8j
  - &jay_mopo age1xnzpnsl06u2qhxvkxdfvmp5ya7075uhsap7qnkp2q6wvxryvh5jsrnmxlq
  - &g9_switcher age18mq57jcl0rj6dftpf385pey7ayha9yt9ddfstyr3tsjldeh2lsyskx5ad3
  # Add additional machine keys here, for example:
  # - &jay_pc age1...

creation_rules:
  - path_regex: (^|.*/)shared\.yaml$
    key_groups:
      - age:
          - *jay_framework
          - *jay_desktop
          - *jay_mopo
          - *g9_switcher
          - *recovery

  - path_regex: (^|.*/)obojima-glyph\.ttf\.json$
    key_groups:
      - age:
          - *jay_framework
          - *jay_desktop
          - *jay_mopo
          - *recovery

  - path_regex: (^|.*/)hosts/jay-framework\.yaml$
    key_groups:
      - age:
          - *jay_framework
          - *recovery

  - path_regex: (^|.*/)hosts/jay-desktop\.yaml$
    key_groups:
      - age:
          - *jay_desktop
          - *recovery

  - path_regex: (^|.*/)hosts/jay-mopo\.yaml$
    key_groups:
      - age:
          - *jay_mopo
          - *recovery

  # Host-specific secrets can differ per machine while reusing the same keys.
  # Example:
  # - path_regex: (^|.*/)hosts/jay-pc\.yaml$
  #   key_groups:
  #     - age:
  #         - *jay_pc
